permissions:
  contents: write

name: ci

on:
  push:
    branches: [dev, 'feat*', 'fix*', 'docs*', 'ci*', 'chore*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Audit
        run: make audit

      - name: Deny
        run: make deny

      - name: Check
        run: make check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build release
        run: |
          cargo build --release --bin tvscreener
          cargo build --release --bin tvscreener-mcp

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvscreener-rs-binaries
          path: |
            target/release/tvscreener
            target/release/tvscreener-mcp

      - name: Doc
        run: make doc

      - name: Github pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@ba1486788b0490a235422264426c45848eac35c6 #v4.4.1
        with:
          folder: docs/api-rust
          commit-message: 'Deploy documentation for ${{ github.ref_name }}'
