permissions:
  contents: write

name: ci

on:
  push:
    branches: [dev, 'feat*', 'fix*', 'docs*', 'ci*', 'chore*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.0

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Audit
        run: make audit

      - name: Deny
        run: make deny

      - name: Check
        run: make check

      - name: Check lean lib
        run: make check-lib

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build release
        run: |
          cargo build --release --features apps --bin tvscreener
          cargo build --release --features apps --bin tvscreener-mcp
          cargo build --release --features apps --bin tvscreener-tui

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvscreener-rs-binaries
          path: |
            target/release/tvscreener
            target/release/tvscreener-mcp
            target/release/tvscreener-tui

      - name: Doc
        run: make doc

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: |
          rustup component add llvm-tools-preview
          make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Github pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@ba1486788b0490a235422264426c45848eac35c6 #v4.4.1
        with:
          folder: docs/api-rust
          commit-message: 'Deploy documentation for ${{ github.ref_name }}'
