name: CI/CD Image

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra Docker image tag (also pushes :latest and Cargo.toml version)'
        required: false
        default: ''

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read app version
        id: version
        run: |
          version="$(awk '/^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: make docker-build

      - name: Push Docker image
        run: |
          make docker-push
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            docker tag gregoshop/tvscreener-rs:latest "gregoshop/tvscreener-rs:${{ github.event.inputs.tag }}"
            docker push "gregoshop/tvscreener-rs:${{ github.event.inputs.tag }}"
          fi
