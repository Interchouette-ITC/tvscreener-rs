name: ci

on:
  push:
    branches: [dev, 'feat/**', 'fix/**', 'docs/**', 'ci/**', 'chore/**']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify
        run: make verify
