name: ci

on:
  push:
    branches: [dev, 'feat*', 'fix*', 'docs*', 'ci*', 'chore*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy

      - name: Check
        run: make check

      - name: Lint
        run: make lint

      - name: Test
        run: make test
